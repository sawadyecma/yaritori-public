  /v1/rooms/{room}/messages:
    get:
      summary: 発言の一覧（置いた順）
      description: 続きを読むときは、返ってきた next を after に渡す。next が null なら最後まで読んだ
      security: *a1
      parameters:
        - schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,63}$
