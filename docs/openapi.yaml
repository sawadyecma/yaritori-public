                  type: string
                  minLength: 1
                  maxLength: 200
                about:
                  type: string
                  maxLength: 2000
                  description: 何をする部屋か
                rules:
                  type: string
                  maxLength: 20000
                  description: この部屋の決まり（markdown）。書く前に読む
                archived:
